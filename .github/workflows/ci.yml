name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the Android host (unit, view model, Compose UI, end-to-end)
        run: ./gradlew :shared:testAndroidHostTest
      - name: Debug build of the Android app
        run: ./gradlew :androidApp:assembleDebug
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: shared/build/reports/tests/
          retention-days: 7

  ios:
    name: iOS tests and build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Build the iOS app and its UI tests
        run: >
          xcodebuild build-for-testing
          -project iosApp/iosApp.xcodeproj
          -scheme iosAppUITests
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/
          retention-days: 7
